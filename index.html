<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heladería Artesanal</title>
<style>
:root{
  --bg:#faf6f1; --card:#fff; --ink:#2b2420; --muted:#7a6d64; --line:#ebe2d8;
  --wood:#9a6b3f; --wood-d:#6e4826; --berry:#d8344f; --berry-l:#fde8ec;
  --green:#2e8b57; --green-l:#e5f4ec; --amber:#b7791f; --amber-l:#fdf3e1; --red:#c0392b;
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:linear-gradient(90deg,var(--wood-d),var(--wood));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header .ttl{flex:1;min-width:0}
header h1{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sec-name{font-size:13px;opacity:.85}
header .rol{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.burger{background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer;padding:2px 6px}
.drawer{display:none}
.drawer.open{display:block}
.drawer .bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.drawer aside{position:fixed;top:0;left:0;bottom:0;width:min(280px,85vw);background:#fff;z-index:21;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,.15)}
.drawer .top{background:linear-gradient(90deg,var(--wood-d),var(--wood));color:#fff;padding:16px}
.drawer .top small{display:block;opacity:.85;margin-top:2px}
.drawer nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 18px;font-size:15px;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line)}
.drawer nav button.on{background:var(--berry-l);color:var(--berry);font-weight:700;border-left:4px solid var(--berry)}
main{max-width:1150px;margin:0 auto;padding:16px}
h2{margin:4px 0 14px;font-size:20px}
h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
input[type=checkbox]{width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:120px}
.btn{border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;background:var(--berry);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:#efe7de;color:var(--ink)}
.btn.ok{background:var(--green)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.x{background:none;color:var(--red);padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--wood)}
.chip.on{background:var(--berry-l);border-color:var(--berry);color:var(--berry);font-weight:600}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pad button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:14px 4px;cursor:pointer;font-size:18px;font-weight:700}
.pad button small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.pad button:active{background:var(--berry-l);border-color:var(--berry)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#efe7de}
.badge.g{background:var(--green-l);color:var(--green)} .badge.a{background:var(--amber-l);color:var(--amber)} .badge.r{background:var(--berry-l);color:var(--red)}
.alert{padding:10px 12px;border-radius:10px;background:var(--amber-l);color:#7a5210;margin-bottom:8px;font-size:14px}
.alert.ok{background:var(--green-l);color:#1d5e3a}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:10px}
.bars div{flex:1;background:var(--berry);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bars div:hover{opacity:1}
.bars-x{display:flex;gap:4px;font-size:10px;color:var(--muted)} .bars-x span{flex:1;text-align:center}
.er td{padding:6px 8px}
.er .sec td{background:#f6efe7;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.er .tot td{font-weight:700;border-top:2px solid var(--ink)}
.er .big td{font-size:17px;font-weight:800;background:var(--green-l)}
.er .big.neg td{background:var(--berry-l)}
.er .ind td:first-child{padding-left:22px}
.muted{color:var(--muted);font-size:13px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);gap:8px}
.cart-item.last{background:var(--berry-l);border-radius:6px;padding:6px}
.total-big{font-size:28px;font-weight:800}
code{background:#f3ece4;padding:1px 5px;border-radius:4px;font-size:13px}
@media print{ header,.drawer,.noprint{display:none!important} body{background:#fff} .card{border:0} }
</style>
</head>
<body>
<header>
  <button class="burger" onclick="menu(true)" aria-label="Menú">☰</button>
  <div class="ttl"><h1 id="tit">🍦 Heladería Artesanal</h1><div class="sec-name" id="secn"></div></div>
  <button class="rol" id="rol" onclick="cambiarRol()"></button>
</header>
<div class="drawer" id="drawer"><div class="bg" onclick="menu(false)"></div>
  <aside><div class="top"><b id="dtit"></b><small id="hoy"></small></div><nav id="nav"></nav></aside></div>
<main id="main"></main>

<script>
/* ================== DATOS ================== */
const KEY = 'heladeria_v3';
const CATS = {
  hielo:'Hielo (barras)', sal:'Sal', gas:'Gas (garrafas)', insumos:'Insumos varios',
  empanadas:'Compra de empanadas', sueldos:'Sueldos personal', reparaciones:'Roturas y reparaciones',
  otros:'Otros gastos'
};
const defaults = () => ({
  config:{
    negocio:'Heladería Artesanal', pin:'1234',
    puntos:[{id:'pp',nombre:'Tienda principal'}],
    precios:[3,5,8,10,15],
    sabores:['Canela:agua','Leche:leche','Chirimoya:leche','Maracuyá:agua','Frutilla:agua','Cupuazú:leche','Piña:agua','Oreo:leche','Chicle:leche']
      .map((s,i)=>{const [n,b]=s.split(':');return {id:'s'+i,nombre:n,base:b,activo:i<6}}),
    // reventa: se compra hecho (stock y costo fijo). Si no, se elabora (costo sale de Producción).
    productos:[{id:'ref',nombre:'Refresco de canela',precio:3,reventa:false},{id:'emp',nombre:'Empanada',precio:5,costo:3.5,reventa:true}],
    hielo:{precio:11,barras:5},
    pagoDiario:110,
    fijos:[{id:'f1',nombre:'Alquiler',monto:800},{id:'f2',nombre:'Agua',monto:10},{id:'f3',nombre:'Luz',monto:40}]
  },
  empleados:[{id:'e1',nombre:'Erika',pago:110},{id:'e2',nombre:'Verónica',pago:110}],
  ventas:[], cajas:[], produccion:[], gastos:[], sobrantes:[], activos:[], incidencias:[]
});
let S = load();
function load(){
  try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d){ const b=defaults(); d.config=Object.assign(b.config,d.config); return Object.assign(b,d); } }catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ alert('No se pudo guardar: '+e.message); } }
// Preferencias de este dispositivo (rol y caja en uso)
const dev = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

/* ================== UTILIDADES ================== */
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy = () => ymd(new Date());
const hora = () => { const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const bs = n => 'Bs '+(Number(n)||0).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = v => parseFloat(String(v).replace(',','.'))||0;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const $ = id => document.getElementById(id);
const val = id => $(id).value;
const sum = (arr,f) => arr.reduce((a,x)=>a+(f?f(x):x),0);
const inR = (f,d,h) => f>=d && f<=h;
const sabor = id => S.config.sabores.find(s=>s.id===id) || {nombre:'(eliminado)'};
const prod = id => S.config.productos.find(p=>p.id===id) || {nombre:'(eliminado)',precio:0};
const mesDe = f => f.slice(0,7);
const diasMes = f => { const [y,m]=f.split('-').map(Number); return new Date(y,m,0).getDate(); };
function rangoDias(d,h){ const out=[]; let x=new Date(d+'T12:00'); const e=new Date(h+'T12:00'); while(x<=e){out.push(ymd(x)); x.setDate(x.getDate()+1);} return out; }
function opts(list,sel,lab='nombre'){ return list.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o[lab])}</option>`).join(''); }
// "Ítems" = lo que se elabora o se guarda: sabores de helado y productos (refresco, empanada…)
const items = () => [...S.config.sabores.map(s=>({id:s.id,nombre:'Helado de '+s.nombre,unidad:'L',reventa:false})),
                     ...S.config.productos.map(p=>({id:p.id,nombre:p.nombre,unidad:p.reventa?'unid.':'L',reventa:p.reventa}))];
const item = id => items().find(i=>i.id===id) || {nombre:'(eliminado)',unidad:''};
function costoUnit(id){ // costo por litro (elaborados) o por unidad (reventa)
  const p=S.config.productos.find(x=>x.id===id); if(p&&p.reventa) return p.costo||0;
  const L=S.produccion.filter(x=>x.item===id); const l=sum(L,x=>x.litros); return l? sum(L,x=>x.costo)/l : 0;
}
function descVenta(v){
  if(v.tipo==='producto') return prod(v.producto).nombre;
  return 'Vaso '+bs(v.precio).replace('Bs ','Bs ')+(v.sabores&&v.sabores.length?' · '+v.sabores.map(s=>sabor(s).nombre).join(', '):'');
}

/* ================== ROLES Y NAVEGACIÓN ================== */
const TABS = [
  ['panel','📊 Panel','a'],['vender','🛒 Anotar ventas','at'],['caja','💵 Caja','at'],['sobrantes','🧊 Sobrantes','at'],
  ['produccion','🧪 Producción','a'],['gastos','🧾 Compras y gastos','a'],['personal','👩‍🍳 Personal','a'],
  ['equipos','🪑 Equipos','a'],['er','📈 Estado de resultados','a'],['config','⚙️ Configuración','a']
];
let rol = dev.get('heladeria_rol') || 'admin';
let tab = rol==='admin' ? 'panel' : 'vender';
const permitido = t => (TABS.find(x=>x[0]===t)||[])[2]?.includes(rol==='admin'?'a':'t');
function cambiarRol(){
  if(rol==='admin'){ rol='trab'; }
  else { const p=prompt('PIN de administradora:'); if(p===null) return; if(p!==S.config.pin) return alert('PIN incorrecto'); rol='admin'; }
  dev.set('heladeria_rol',rol); render();
}
function menu(on){ $('drawer').classList.toggle('open',on); }
function go(t){ tab=t; menu(false); render(); window.scrollTo(0,0); }
function render(){
  if(!permitido(tab)) tab = rol==='admin'?'panel':'vender';
  $('tit').textContent = $('dtit').textContent = '🍦 '+S.config.negocio;
  $('secn').textContent = TABS.find(x=>x[0]===tab)[1];
  $('hoy').textContent = new Date().toLocaleDateString('es-BO',{weekday:'long',day:'numeric',month:'long'});
  $('rol').textContent = rol==='admin' ? '👑 Administradora' : '🙋‍♀️ Trabajadora';
  $('nav').innerHTML = TABS.filter(x=>permitido(x[0])).map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  $('main').innerHTML = V[tab]();
  if(V[tab+'After']) V[tab+'After']();
}
const V = {};

/* ================== CÁLCULOS ================== */
const cajaSel = () => { const c=S.cajas.find(x=>x.id===dev.get('heladeria_caja')); return c&&!c.cerrada ? c : null; };
const cajasAbiertas = () => S.cajas.filter(c=>!c.cerrada);
function cajaResumen(c){
  const vs = S.ventas.filter(v=>v.cajaId===c.id);
  const efectivo = sum(vs.filter(v=>v.metodo==='efectivo'),v=>v.total);
  const qr = sum(vs.filter(v=>v.metodo==='qr'),v=>v.total);
  const gastosCaja = sum(S.gastos.filter(g=>g.cajaId===c.id),g=>g.monto);
  const retiros = sum(c.retiros||[],r=>r.monto);
  // mientras alguien reemplaza, el efectivo que cobró lo tiene ella hasta que lo devuelve
  const re = (c.reemplazos||[]).find(r=>!r.fin);
  const fuera = re ? sum(vs.filter(v=>v.reempId===re.id&&v.metodo==='efectivo'),v=>v.total) : 0;
  const difReemp = sum((c.reemplazos||[]).filter(r=>r.fin),r=>r.diferencia||0);
  const esperado = c.montoInicial + efectivo - fuera + difReemp - gastosCaja - retiros;
  return {efectivo,qr,gastosCaja,retiros,fuera,difReemp,esperado,total:efectivo+qr,vasos:sum(vs.filter(v=>v.tipo==='helado'),v=>v.cant),n:vs.length};
}
function stockEmpanadas(){
  return sum(S.gastos.filter(g=>g.categoria==='empanadas'),g=>g.cantidad||0)
       - sum(S.ventas.filter(v=>v.producto==='emp'),v=>v.cant)
       - sum(S.sobrantes.filter(s=>s.item==='emp'&&s.recuperado!=null),s=>s.merma);
}
function depMensual(f){
  return sum(S.activos,a=>{
    if(!a.vidaMeses || a.fechaCompra > f) return 0;
    const [y1,m1]=a.fechaCompra.split('-').map(Number), [y2,m2]=f.split('-').map(Number);
    return (y2-y1)*12+(m2-m1) < a.vidaMeses ? a.cantidad*a.costo/a.vidaMeses : 0;
  });
}
function calcER(d,h){
  const V_=S.ventas.filter(v=>inR(v.fecha,d,h)), G=S.gastos.filter(g=>inR(g.fecha,d,h)), P=S.produccion.filter(p=>inR(p.fecha,d,h));
  const I=S.incidencias.filter(i=>inR(i.fecha,d,h)), C=S.cajas.filter(c=>c.cerrada&&inR(c.fecha,d,h));
  const M=S.sobrantes.filter(s=>s.recuperado!=null&&inR(s.fechaRec,d,h));
  const gc=k=>sum(G.filter(g=>g.categoria===k),g=>g.monto);
  const dias=rangoDias(d,h);
  const fijos=S.config.fijos.map(fx=>({nombre:fx.nombre,monto:sum(dias,x=>fx.monto/diasMes(x))}));
  const HV=V_.filter(v=>v.tipo==='helado');
  const mermaElab=sum(M.filter(m=>!item(m.item).reventa),m=>m.valorMerma), mermaRev=sum(M.filter(m=>item(m.item).reventa),m=>m.valorMerma);
  const r={
    vPuntos:S.config.puntos.map(p=>({nombre:p.nombre,monto:sum(HV.filter(v=>v.punto===p.id),v=>v.total)})).filter(p=>p.monto),
    vProd:S.config.productos.map(p=>({nombre:p.nombre,monto:sum(V_.filter(v=>v.producto===p.id),v=>v.total)})),
    // las mermas se separan del costo para verlas aparte (el total no cambia)
    cInsumos:sum(P,p=>p.costo)+gc('insumos')-mermaElab,
    cHielo:gc('hielo'), cSal:gc('sal'), cGas:gc('gas'), cEmp:gc('empanadas')-mermaRev,
    cMerma:mermaElab+mermaRev,
    gSueldos:gc('sueldos'), fijos,
    gRep:gc('reparaciones')+sum(I,i=>i.costo),
    gDep:sum(dias,x=>depMensual(x)/diasMes(x)),
    gDif:-sum(C,c=>(c.diferencia||0)+sum(c.reemplazos||[],r=>r.diferencia||0)),
    gOtros:gc('otros'),
    vasos:sum(HV,v=>v.cant), dias:dias.length
  };
  r.vHelado=sum(r.vPuntos,p=>p.monto);
  r.ingresos=r.vHelado+sum(r.vProd,p=>p.monto);
  r.costoVentas=r.cInsumos+r.cHielo+r.cSal+r.cGas+r.cEmp+r.cMerma;
  r.bruta=r.ingresos-r.costoVentas;
  r.gFijos=sum(fijos,f=>f.monto);
  r.gastosOp=r.gSueldos+r.gFijos+r.gRep+r.gDep+r.gDif+r.gOtros;
  r.neta=r.bruta-r.gastosOp;
  // rentabilidad por sabor/producto: un vaso con varios sabores reparte su precio entre ellos
  const acc={};
  const A=id=>acc[id]||(acc[id]={id,venta:0,vasos:0,costo:0,merma:0});
  HV.forEach(v=>{ const ss=v.sabores&&v.sabores.length?v.sabores:['_sin']; ss.forEach(s=>{const a=A(s); a.venta+=v.total/ss.length; a.vasos+=v.cant/ss.length;}); });
  V_.filter(v=>v.tipo==='producto').forEach(v=>{const a=A(v.producto); a.venta+=v.total; a.vasos+=v.cant;});
  P.forEach(p=>A(p.item).costo+=p.costo);
  M.forEach(m=>A(m.item).merma+=m.valorMerma);
  r.rent=Object.values(acc).map(a=>({...a,nombre:a.id==='_sin'?'(sin sabor anotado)':(S.config.productos.some(p=>p.id===a.id)?prod(a.id).nombre:sabor(a.id).nombre)})).sort((a,b)=>b.venta-a.venta);
  return r;
}

/* ================== PANEL ================== */
V.panel = () => {
  const f=hoy(), mes=f.slice(0,8)+'01', rHoy=calcER(f,f), rMes=calcER(mes,f);
  const ab=cajasAbiertas(), alerts=[];
  if(!S.cajas.some(x=>x.fecha===f)) alerts.push(`Hoy todavía no se abrió ninguna caja. <a href="#" onclick="go('caja');return false">Abrir caja</a>`);
  const viejas=ab.filter(c=>c.fecha<f); if(viejas.length) alerts.push(`Hay ${viejas.length} caja(s) de días anteriores sin cerrar. <a href="#" onclick="go('caja');return false">Ver</a>`);
  if(!S.gastos.some(g=>g.fecha===f&&g.categoria==='hielo')) alerts.push(`No se registró la compra de hielo de hoy. <a href="#" onclick="go('gastos');return false">Registrar</a>`);
  if(!S.gastos.some(g=>g.fecha===f&&g.categoria==='sueldos') && S.empleados.length) alerts.push(`Falta registrar la jornada del personal de hoy. <a href="#" onclick="go('personal');return false">Registrar</a>`);
  const pend=S.sobrantes.filter(s=>s.recuperado==null); if(pend.length) alerts.push(`Hay ${pend.length} sobrante(s) guardados sin revisar cuánto se recuperó. <a href="#" onclick="go('sobrantes');return false">Revisar</a>`);
  const st=stockEmpanadas(); if(st<0) alerts.push(`El stock de empanadas está en negativo (${st}). Falta registrar una compra.`);
  const dias=rangoDias(ymd(new Date(Date.now()-13*864e5)),f), vd=dias.map(x=>sum(S.ventas.filter(v=>v.fecha===x),v=>v.total)), mx=Math.max(1,...vd);
  return `<h2>Panel</h2>
  ${alerts.map(a=>`<div class="alert">⚠️ ${a}</div>`).join('') || '<div class="alert ok">✅ Todo al día.</div>'}
  <div class="grid g4">
    <div class="card kpi"><div class="lbl">Ventas de hoy</div><div class="val">${bs(rHoy.ingresos)}</div><div class="sub">${rHoy.vasos} vasos de helado</div></div>
    <div class="card kpi"><div class="lbl">Cajas abiertas</div><div class="val">${ab.length}</div><div class="sub">${ab.map(c=>esc(c.responsable)+' en '+esc(puntoNom(c.punto))+(reempActivo(c)?' (la reemplaza '+esc(reempActivo(c).quien)+')':'')).join(' · ')||'—'}</div></div>
    <div class="card kpi"><div class="lbl">Ingresos del mes</div><div class="val">${bs(rMes.ingresos)}</div><div class="sub">${rMes.dias} días</div></div>

let cart=[], rapidoTxt='';
function findSabor(w){ if(w.length<3) return null; const L=S.config.sabores;
  return L.find(s=>norm(s.nombre)===w) || L.find(s=>norm(s.nombre).startsWith(w)) || L.find(s=>w.startsWith(norm(s.nombre))); }
function findProd(w){ if(w.length<3) return null; // solo por la primera palabra: "refresco", "empanada"
  return S.config.productos.find(p=>{const k=norm(p.nombre).split(' ')[0]; return k.startsWith(w)||w.startsWith(k);}); }
function parseRapido(txt){
  const t=norm(txt).replace(/bs\.?/g,' ')
    .replace(/(\d+)\s*sabor(es)?\s*(de)?\s*(\d+(?:[.,]\d+)?)/g,'$4')   // "3 sabores de 10" → vaso de 10
    .replace(/(\d+)\s*[x*]\s*(\d)/g,'$1x$2');
  const tk=t.split(/[\s,;+\n]+/).filter(Boolean), out=[], warn=[]; let qr=false, last=null;
  const ign=['de','y','con','un','una','vaso','vasos','sabor','sabores','a','el','la','otro','otra','helado','helados'];
  for(let i=0;i<tk.length;i++){
    const w=tk[i]; if(ign.includes(w)) continue;
    if(w==='qr'){qr=true;continue;}
    let m=w.match(/^(\d+)x(\d+(?:[.,]\d+)?)$/);
    if(m){ last={tipo:'helado',cant:+m[1],precio:num(m[2]),sabores:[]}; out.push(last); continue; }
    if(/^\d+([.,]\d+)?$/.test(w)){
      const p=tk[i+1]&&findProd(tk[i+1]);
      if(p){ out.push({tipo:'producto',producto:p.id,cant:num(w),precio:p.precio}); last=null; i++; continue; }
      last={tipo:'helado',cant:1,precio:num(w),sabores:[]}; out.push(last); continue;
    }
    const p=findProd(w); if(p){ out.push({tipo:'producto',producto:p.id,cant:1,precio:p.precio}); last=null; continue; }
    const s=findSabor(w);
    if(s){ if(last) { if(!last.sabores.includes(s.id)) last.sabores.push(s.id); } else warn.push(w+' (falta el precio antes)'); continue; }
    warn.push(w);
  }
  return {items:out,warn,qr};
}

}

/* ================== ESTADO DE RESULTADOS ================== */
let erD, erH;
function preset(p){
  const t=new Date(), f=ymd(t);
  if(p==='hoy'){erD=erH=f}
  if(p==='semana'){const d=new Date(t);d.setDate(d.getDate()-((d.getDay()+6)%7));erD=ymd(d);erH=f}
  if(p==='mes'){erD=f.slice(0,8)+'01';erH=f}
  if(p==='mesant'){erD=ymd(new Date(t.getFullYear(),t.getMonth()-1,1));erH=ymd(new Date(t.getFullYear(),t.getMonth(),0))}
  if(p==='anio'){erD=f.slice(0,4)+'-01-01';erH=f}
  render();
}
V.er = () => {
  if(!erD){erD=hoy().slice(0,8)+'01';erH=hoy();}
  const r=calcER(erD,erH), pct=x=>r.ingresos?(x/r.ingresos*100).toFixed(1)+'%':'—';
  const L=(t,v,c='ind')=>`<tr class="${c}"><td>${t}</td><td class="n">${bs(v)}</td><td class="n muted">${pct(v)}</td></tr>`;
  const S_=t=>`<tr class="sec"><td colspan=3>${t}</td></tr>`;
  const margen=r.ingresos?r.bruta/r.ingresos:0;
  const fijosMes=sum(S.config.fijos,f=>f.monto)+(r.dias?(r.gSueldos+r.gDep)/r.dias*30:0);
  return `<h2>Estado de resultados</h2>
  <div class="card noprint"><div class="chips" style="margin-bottom:10px">
    ${[['hoy','Hoy'],['semana','Esta semana'],['mes','Este mes'],['mesant','Mes anterior'],['anio','Este año']].map(([k,l])=>`<span class="chip" onclick="preset('${k}')">${l}</span>`).join('')}</div>
    <div class="row"><div><label>Desde</label><input type="date" value="${erD}" onchange="erD=this.value;render()"></div><div><label>Hasta</label><input type="date" value="${erH}" onchange="erH=this.value;render()"></div>
    <div><button class="btn sec" onclick="window.print()">🖨️ Imprimir / PDF</button> <button class="btn sec" onclick="exportER()">⬇️ Excel (CSV)</button></div></div></div>
  <div class="card">
    <div style="text-align:center;margin-bottom:12px"><b style="font-size:18px">${esc(S.config.negocio)}</b><br>ESTADO DE RESULTADOS<br><span class="muted">Del ${erD} al ${erH} (${r.dias} días) · Expresado en bolivianos</span></div>
    <div class="tbl-wrap"><table class="er">
      <tr><th></th><th class="n">Monto</th><th class="n">% ventas</th></tr>
      ${S_('Ingresos')}${r.vPuntos.map(p=>L('Helados · '+esc(p.nombre),p.monto)).join('')||L('Helados',0)}
      ${r.vProd.map(p=>L('Ventas de '+esc(p.nombre.toLowerCase()),p.monto)).join('')}
      ${L('Total ingresos',r.ingresos,'tot')}
      ${S_('(−) Costo de ventas')}${L('Insumos de helado y refresco (frutas, esencias, leche, azúcar…)',r.cInsumos)}${L('Hielo',r.cHielo)}${L('Sal',r.cSal)}${L('Gas (garrafas)',r.cGas)}${L('Empanadas',r.cEmp)}
      ${L('Mermas: sobrantes que no se recuperaron',r.cMerma)}
      ${L('Total costo de ventas',r.costoVentas,'tot')}
      ${L('UTILIDAD BRUTA',r.bruta,'tot')}
      ${S_('(−) Gastos de operación')}${L('Sueldos del personal (incluye almuerzo)',r.gSueldos)}
      ${r.fijos.map(f=>L(esc(f.nombre),f.monto)).join('')}
      ${L('Roturas y reparaciones',r.gRep)}${L('Depreciación de equipos',r.gDep)}${L('Faltantes (−sobrantes) de caja',r.gDif)}${L('Otros gastos',r.gOtros)}
      ${L('Total gastos de operación',r.gastosOp,'tot')}
      <tr class="big ${r.neta<0?'neg':''}"><td>UTILIDAD (PÉRDIDA) NETA</td><td class="n">${bs(r.neta)}</td><td class="n">${pct(r.neta)}</td></tr>
    </table></div>
    <p class="muted">Antes de impuestos. Gastos fijos y depreciación se prorratean por día según el periodo.</p></div>
  <div class="grid g2">
    <div class="card"><h3>Indicadores</h3><table>
      <tr><td>Venta promedio por día</td><td class="n">${bs(r.ingresos/(r.dias||1))}</td></tr>
      <tr><td>Vasos de helado vendidos</td><td class="n">${Math.round(r.vasos)}</td></tr>
      <tr><td>Precio promedio por vaso</td><td class="n">${bs(r.vasos?r.vHelado/r.vasos:0)}</td></tr>
      <tr><td>Margen bruto</td><td class="n">${(margen*100).toFixed(1)}%</td></tr>
      <tr><td>Punto de equilibrio mensual (ventas mínimas para no perder)</td><td class="n">${bs(margen>0?fijosMes/margen:0)}</td></tr>
      <tr><td>Fondo sugerido para reponer equipos (por mes)</td><td class="n">${bs(depMensual(erH))}</td></tr></table></div>
    <div class="card"><h3>Rentabilidad por sabor y producto</h3><div class="tbl-wrap"><table>
      <tr><th>Sabor / producto</th><th class="n">Ventas</th><th class="n">Insumos</th><th class="n">Mermas</th><th class="n">Margen</th></tr>
      ${r.rent.map(s=>{const m=s.venta-s.costo; return `<tr><td>${esc(s.nombre)}</td><td class="n">${bs(s.venta)}</td><td class="n">${bs(s.costo)}</td><td class="n">${bs(s.merma)}</td><td class="n ${m<0?'neg':'pos'}">${bs(m)}</td></tr>`}).join('')||'<tr><td colspan=5 class="muted">Sin datos</td></tr>'}
    </table></div><p class="muted">Si un vaso tiene varios sabores, su precio se reparte entre ellos. El costo de insumos ya incluye lo que se perdió como merma.</p></div>
  </div>`;
};
function exportER(){
  const r=calcER(erD,erH), rows=[['Estado de resultados',S.config.negocio],['Periodo',erD+' a '+erH],[],
    ['INGRESOS'],...r.vPuntos.map(p=>['Helados '+p.nombre,p.monto]),...r.vProd.map(p=>['Ventas '+p.nombre,p.monto]),['Total ingresos',r.ingresos],
    ['COSTO DE VENTAS'],['Insumos helado y refresco',r.cInsumos],['Hielo',r.cHielo],['Sal',r.cSal],['Gas',r.cGas],['Empanadas',r.cEmp],['Mermas',r.cMerma],['Total costo de ventas',r.costoVentas],
    ['UTILIDAD BRUTA',r.bruta],['GASTOS DE OPERACION'],['Sueldos',r.gSueldos],...r.fijos.map(f=>[f.nombre,f.monto]),
    ['Roturas y reparaciones',r.gRep],['Depreciacion',r.gDep],['Faltantes de caja',r.gDif],['Otros',r.gOtros],['Total gastos de operacion',r.gastosOp],['UTILIDAD NETA',r.neta]];
  descargar(`estado_resultados_${erD}_${erH}.csv`,'﻿'+rows.map(x=>x.map(c=>typeof c==='number'?c.toFixed(2):'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv');
}
function descargar(name,content,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); }

/* ================== CONFIGURACIÓN ================== */
V.config = () => {
  const c=S.config;
  return `<h2>Configuración</h2>
  <div class="grid g2">
  <div class="card"><h3>Negocio</h3>
    <div class="row"><div><label>Nombre</label><input value="${esc(c.negocio)}" onchange="S.config.negocio=this.value;save();render()"></div>
    <div><label>PIN de administradora</label><input value="${esc(c.pin)}" onchange="S.config.pin=this.value;save()"></div></div>
    <div class="row" style="margin-top:8px"><div><label>Hielo: precio por barra</label><input type="number" value="${c.hielo.precio}" onchange="S.config.hielo.precio=num(this.value);save()"></div>
    <div><label>Hielo: barras por día</label><input type="number" value="${c.hielo.barras}" onchange="S.config.hielo.barras=num(this.value);save()"></div>
    <div><label>Pago diario personal</label><input type="number" value="${c.pagoDiario}" onchange="S.config.pagoDiario=num(this.value);save()"></div></div>
    <h3 style="margin-top:16px">Precios de vaso (botones)</h3>
    <input value="${c.precios.join(', ')}" onchange="S.config.precios=this.value.split(/[ ,;]+/).map(num).filter(Boolean);save();render()">
    <p class="muted">Separados por coma. Al escribir rápido se puede usar cualquier precio.</p>
    <h3 style="margin-top:16px">Otros productos</h3>
    <table><tr><th>Nombre</th><th>Precio</th><th>¿Se compra hecho?</th><th>Costo unid.</th><th></th></tr>
    ${c.productos.map((p,i)=>`<tr><td><input value="${esc(p.nombre)}" onchange="S.config.productos[${i}].nombre=this.value;save()"></td><td><input type="number" value="${p.precio}" onchange="S.config.productos[${i}].precio=num(this.value);save()"></td>
      <td><input type="checkbox" ${p.reventa?'checked':''} onchange="S.config.productos[${i}].reventa=this.checked;save();render()"></td><td>${p.reventa?`<input type="number" value="${p.costo||0}" onchange="S.config.productos[${i}].costo=num(this.value);save()">`:'<span class="muted">de Producción</span>'}</td>
      <td>${p.id==='emp'?'':`<button class="btn x" onclick="S.config.productos.splice(${i},1);save();render()">✕</button>`}</td></tr>`).join('')}</table>
    <button class="btn sec sm" style="margin-top:6px" onclick="S.config.productos.push({id:uid(),nombre:'Nuevo producto',precio:5,reventa:false});save();render()">+ Producto</button>
    <h3 style="margin-top:16px">Gastos fijos mensuales</h3>
    ${c.fijos.map((f,i)=>`<div class="row" style="margin-bottom:6px"><div><input value="${esc(f.nombre)}" onchange="S.config.fijos[${i}].nombre=this.value;save()"></div><div><input type="number" value="${f.monto}" onchange="S.config.fijos[${i}].monto=num(this.value);save()"></div><div style="flex:0"><button class="btn x" onclick="S.config.fijos.splice(${i},1);save();render()">✕</button></div></div>`).join('')}
    <button class="btn sec sm" onclick="S.config.fijos.push({id:uid(),nombre:'Nuevo gasto',monto:0});save();render()">+ Gasto fijo</button>
  </div>
  <div class="card"><h3>Sabores</h3><p class="muted">Marca los que hay hoy: aparecen como botones y al cerrar caja.</p>
    <table>${c.sabores.map((s,i)=>`<tr><td><input type="checkbox" ${s.activo?'checked':''} onchange="S.config.sabores[${i}].activo=this.checked;save()"></td><td><input value="${esc(s.nombre)}" onchange="S.config.sabores[${i}].nombre=this.value;save()"></td><td><select onchange="S.config.sabores[${i}].base=this.value;save()"><option value="agua" ${s.base==='agua'?'selected':''}>Agua hervida</option><option value="leche" ${s.base==='leche'?'selected':''}>Leche</option></select></td></tr>`).join('')}</table>
    <button class="btn sec sm" style="margin-top:8px" onclick="S.config.sabores.push({id:uid(),nombre:'Nuevo sabor',base:'agua',activo:true});save();render()">+ Sabor</button>
    <h3 style="margin-top:20px">Respaldo de datos</h3><p class="muted">Los datos se guardan en este navegador. Descarga un respaldo seguido.</p>
    <div class="chips"><button class="btn sec" onclick="descargar('respaldo_heladeria_'+hoy()+'.json',JSON.stringify(S),'application/json')">⬇️ Descargar respaldo</button>
    <label class="btn sec" style="color:var(--ink);font-size:14px;margin:0">⬆️ Restaurar<input type="file" accept=".json" hidden onchange="restaurar(this.files[0])"></label>

    <button class="btn" onclick="if(confirm('¿Borrar TODOS los datos?')){S=defaults();save();render()}">Borrar todo</button></div>

function restaurar(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result), b=defaults(); d.config=Object.assign(b.config,d.config); S=Object.assign(b,d); save(); render(); alert('Datos restaurados'); }catch(e){ alert('Archivo inválido'); } }; r.readAsText(file); }

/* ================== DATOS DE EJEMPLO ================== */
function demo(){
  if(S.ventas.length && !confirm('Esto reemplaza los datos actuales por datos de ejemplo. ¿Continuar?')) return;
  S=defaults(); const c=S.config, R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.round(R(a,b));
  c.puntos.push({id:'p2',nombre:'Feria dominical'},{id:'p3',nombre:'Tienda del mercado'});
  const ini=ymd(new Date(Date.now()-75*864e5));
  S.activos=[['Cocina a gas',1,650,60],['Refrigerador',2,2800,84],['Baldes de madera con lata',6,180,24],['Garrafas',2,350,60],['Estantes',2,250,48],['Mesas',3,150,36],['Sillas',8,45,24],['Carpas',2,400,24]]
    .map(([n,q,p,v])=>({id:uid(),nombre:n,cantidad:q,costo:p,vidaMeses:v,fechaCompra:ini}));
  const act=c.sabores.filter(s=>s.activo), dias=rangoDias(ymd(new Date(Date.now()-44*864e5)),ymd(new Date(Date.now()-864e5)));
  const V_=(f,caja,o)=>S.ventas.push({id:uid(),fecha:f,hora:'',cajaId:caja.id,punto:caja.punto,producto:null,sabores:[],metodo:Math.random()<.8?'efectivo':'qr',...o,total:o.cant*o.precio});
  let pendSob=[], empRec=0;
  dias.forEach((f,di)=>{
    const dow=new Date(f+'T12:00').getDay(), k=(dow===0||dow===6)?1.4:1;
    // recuperar lo guardado ayer
    empRec=0; pendSob.forEach(s=>{ s.recuperado=s.item==='emp'?Math.max(0,s.cantidad-RI(0,1)):+(s.cantidad*R(.6,1)).toFixed(1); s.merma=+(s.cantidad-s.recuperado).toFixed(2); s.fechaRec=f; if(s.item==='emp') empRec=s.recuperado; }); pendSob=[];
    const caja={id:uid(),fecha:f,horaAp:'09:00',responsable:'Erika',punto:'pp',montoInicial:50,retiros:[],cerrada:true,
      reemplazos:di%3===0?[{id:uid(),quien:di%2?'Dueña':'Verónica',inicio:'13:00',fin:'13:35',diferencia:0}]:[]};
    S.cajas.push(caja);
    S.gastos.push({id:uid(),fecha:f,categoria:'hielo',desc:'5 barras de hielo',cantidad:5,monto:55,cajaId:caja.id});
    if(di%3===0) S.gastos.push({id:uid(),fecha:f,categoria:'sal',desc:'Sal',cantidad:1,monto:5});
    if(di%4===0) S.gastos.push({id:uid(),fecha:f,categoria:'gas',desc:'Garrafa de gas',cantidad:1,monto:22.5});
    const emp=RI(24,32); S.gastos.push({id:uid(),fecha:f,categoria:'empanadas',desc:'Empanadas',cantidad:emp,monto:emp*3.5});
    S.empleados.forEach(e=>S.gastos.push({id:uid(),fecha:f,categoria:'sueldos',desc:e.nombre,empleadoId:e.id,monto:110}));
    act.forEach(s=>{ if(di%2===0){ const fr=R(25,55), es=R(5,9), base=s.base==='leche'?R(20,32):0, az=R(8,14);
      S.produccion.push({id:uid(),fecha:f,item:s.id,base:s.base,litros:RI(9,12),insumos:[{desc:'Fruta/insumo',costo:+fr.toFixed(2)},{desc:'Esencia',costo:+es.toFixed(2)},{desc:'Azúcar',costo:+az.toFixed(2)}].concat(base?[{desc:'Leche',costo:+base.toFixed(2)}]:[]),costo:+(fr+es+az+base).toFixed(2)}); }});
    S.produccion.push({id:uid(),fecha:f,item:'ref',base:'agua',litros:15,insumos:[{desc:'Canela',costo:8},{desc:'Azúcar',costo:12},{desc:'Clavo de olor',costo:3}],costo:23});
    [[3,20],[5,36],[8,18],[10,14],[15,4]].forEach(([p,n])=>{ for(let j=0;j<RI(n*k*.7,n*k*1.3);j++){
      const ns=p<=3?1:p<=5?RI(1,2):RI(2,3), ss=[...act].sort(()=>Math.random()-.5).slice(0,ns).map(s=>s.id);
      V_(f,caja,{tipo:'helado',cant:1,precio:p,sabores:ss}); }});
    V_(f,caja,{tipo:'producto',producto:'ref',cant:RI(15,30)*k|0,precio:3,metodo:'efectivo'});
    const sobE=RI(0,4), ev=emp+empRec-sobE; V_(f,caja,{tipo:'producto',producto:'emp',cant:ev,precio:5,metodo:'efectivo'});
    const sob=[...act].sort(()=>Math.random()-.5).slice(0,2).map(s=>({id:uid(),fecha:f,cajaId:caja.id,item:s.id,cantidad:RI(1,3),recuperado:null}));
    if(sobE) sob.push({id:uid(),fecha:f,cajaId:caja.id,item:'emp',cantidad:sobE,recuperado:null});
    S.sobrantes.push(...sob); pendSob=sob;
    const r=cajaResumen(caja); caja.diferencia=[0,0,0,-2,1,0,-5,0][RI(0,7)]; caja.contado=+(r.esperado+caja.diferencia).toFixed(2);
    if(dow===0){ const cx={id:uid(),fecha:f,horaAp:'10:00',responsable:'Verónica',punto:'p2',montoInicial:20,retiros:[],reemplazos:[],cerrada:true}; S.cajas.push(cx);
      for(let j=0;j<RI(40,60);j++) V_(f,cx,{tipo:'helado',cant:1,precio:[3,5,5,8][RI(0,3)],sabores:[act[RI(0,2)].id],metodo:'efectivo'});
      const rx=cajaResumen(cx); cx.diferencia=-RI(0,1)*3; cx.contado=rx.esperado+cx.diferencia; }
  });
  // hoy: dos cajas abiertas, y la dueña reemplazando a Verónica
  const t=hoy(), c1={id:uid(),fecha:t,horaAp:'09:05',responsable:'Erika',punto:'pp',montoInicial:50,retiros:[],reemplazos:[],cerrada:false},
    c2={id:uid(),fecha:t,horaAp:'09:20',responsable:'Verónica',punto:'p3',montoInicial:30,retiros:[],reemplazos:[{id:uid(),quien:'Dueña',inicio:'13:10',fin:null}],cerrada:false};
  S.cajas.push(c1,c2);
  for(let j=0;j<25;j++) V_(t,c1,{tipo:'helado',cant:1,precio:[3,5,5,8,10][RI(0,4)],sabores:[act[RI(0,5)].id],vendedor:'Erika',hora:pad(9+(j/4|0))+':'+pad(RI(0,59))});
  for(let j=0;j<12;j++) V_(t,c2,{tipo:'helado',cant:1,precio:[3,5,8][RI(0,2)],sabores:[act[RI(0,5)].id],vendedor:'Verónica',hora:pad(9+(j/3|0))+':'+pad(RI(0,59))});
  for(let j=0;j<3;j++) V_(t,c2,{tipo:'helado',cant:1,precio:5,sabores:[act[0].id],vendedor:'Dueña',reempId:c2.reemplazos[0].id,hora:'13:'+pad(15+j*5),metodo:'efectivo'});
  S.sobrantes.filter(s=>s.recuperado!=null).forEach(s=>s.valorMerma=+(s.merma*costoUnit(s.item)).toFixed(2));
  const sil=S.activos.find(a=>a.nombre==='Sillas'), ref=S.activos.find(a=>a.nombre==='Refrigerador'), bal=S.activos.find(a=>a.nombre.startsWith('Baldes'));
  S.incidencias.push({id:uid(),fecha:dias[8],activoId:sil.id,tipo:'rotura',unidades:1,costo:0,detalle:'Se rompió una pata'}); sil.cantidad--;
  S.incidencias.push({id:uid(),fecha:dias[20],activoId:ref.id,tipo:'reparacion',unidades:1,costo:180,detalle:'Recarga de gas del refrigerador'});
  S.incidencias.push({id:uid(),fecha:dias[33],activoId:bal.id,tipo:'reparacion',unidades:1,costo:35,detalle:'Cambio de zuncho del balde'});
  save(); go('panel');
}

render();
